            recommended_treatment_id: "TRT_COPPER_HYDROXIDE"
        treatments:
          - id: "TRT_COPPER_HYDROXIDE"
            trade_name: "Copper Hydroxide 77% WP"
            chemical_class: "Inorganic Copper Protectant"
