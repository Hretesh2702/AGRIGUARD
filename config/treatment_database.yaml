# AgriGuard — Verified Agricultural Treatment Knowledge Base
# Controlled agronomic interventions verified by agricultural extension authorities
# DO NOT ALTER WITHOUT CERTIFIED AGRONOMIC GUIDANCE

version: "2.1.0"
authority: "USDA-ARS Vegetable Pathology & ICAR Plant Protection Directory"
last_audit: "2026-06-20"

crops:
  tomato:
    scientific_name: "Solanum lycopersicum"
    common_name: "Tomato"
    diseases:
      early_blight:
        display_name: "Early Blight"
        pathogen: "Alternaria solani (Fungal)"
        characteristic_symptoms: "Dark brown to black necrotic lesions with concentric rings ('target' or 'bullseye' pattern) on older lower foliage, chlorotic yellow halo surrounding lesions."
        confusable_with: "Nitrogen Deficiency (Chlorosis without concentric rings)"
        severity_tiers:
          mild:
            description: "Few isolated spots (<5mm) on lowest leaves only; canopy unaffected"
            recommended_treatment_id: "TRT_COPPER_HYDROXIDE"
          moderate:
            description: "Multiple concentric lesions, lower foliage yellowing and blighting; spread to mid-canopy"
            recommended_treatment_id: "TRT_COPPER_HYDROXIDE"
          severe:
            description: "Canopy defoliation >35%, stem lesions, imminent fruit yield loss"
            recommended_treatment_id: "TRT_CHLOROTHALONIL"
        treatments:
          - id: "TRT_COPPER_HYDROXIDE"
            trade_name: "Copper Hydroxide 77% WP (Kocide Class)"
            chemical_class: "Inorganic Copper Fungicide (FRAC Group M01)"
            target_inventory_code: "TANK_COPPER_FUNGICIDE"
            active_concentration_gl: 2.0
            dosage_description: "2.0 grams per Liter of clean water (0.20% w/v)"
            application_method: "Fine hydraulic cone misting targeting underside and topside of affected foliage"
            pulse_duration_ms: 2500
            estimated_volume_ml: 40.0
            spray_pressure_psi: 35
            re_entry_interval_hours: 48
            pre_harvest_interval_days: 0
            safety_notes: "Mandatory nitrile gloves and vapor mask. Toxic to aquatic organisms. Do not inhale spray mist."
            environmental_restrictions:
              max_temp_c: 32.0
              max_humidity_pct: 88.0
              min_soil_moisture_pct: 22.0 # Prohibited during severe drought stress

          - id: "TRT_BIO_NEEM"
            trade_name: "Cold-Pressed Organic Bio-Neem Solution (Azadirachtin 0.03%)"
            chemical_class: "Botanical Bio-Fungicide & Antifeedant"
            target_inventory_code: "TANK_NEEM_ORGANIC"
            active_concentration_gl: 5.0
            dosage_description: "5.0 mL per Liter of water with mild organic surfactant"
            application_method: "Direct leaf wetting targeting early symptom foci"
            pulse_duration_ms: 3000
            estimated_volume_ml: 48.0
            spray_pressure_psi: 30
            re_entry_interval_hours: 4
            pre_harvest_interval_days: 1
            safety_notes: "Organic certified. Spray late evening to protect honeybees and pollinators."
            environmental_restrictions:
              max_temp_c: 30.0
              max_humidity_pct: 92.0
              min_soil_moisture_pct: 20.0

      late_blight:
        display_name: "Late Blight"
        pathogen: "Phytophthora infestans (Oomycete)"
        characteristic_symptoms: "Large, irregular water-soaked pale-green to brown lesions; white fungal-like sporulation on leaf underside in humid mornings."
        severity_tiers:
          mild:
            description: "Pale water-soaked spots on leaf tips and margins"
            recommended_treatment_id: "TRT_CYMOXANIL_MANCOZEB"
          moderate:
            description: "Rapidly expanding necrotic patches, white sporulation visible on underside"
            recommended_treatment_id: "TRT_CYMOXANIL_MANCOZEB"
          severe:
            description: "Entire branches collapsing, blackened stems, fruit rot"
            recommended_treatment_id: "TRT_CYMOXANIL_MANCOZEB"
        treatments:
          - id: "TRT_CYMOXANIL_MANCOZEB"
            trade_name: "Cymoxanil 8% + Mancozeb 64% WP"
            chemical_class: "Curative & Contact Multi-Site Protectant (FRAC 27 + M03)"
            target_inventory_code: "TANK_COPPER_FUNGICIDE"
            active_concentration_gl: 2.5
            dosage_description: "2.5 grams per Liter of water"
            application_method: "High-pressure fine cone nozzle delivering complete lower leaf coverage"
            pulse_duration_ms: 3500
            estimated_volume_ml: 55.0
            spray_pressure_psi: 40
            re_entry_interval_hours: 48
            pre_harvest_interval_days: 7
            safety_notes: "Full PPE required: rubber boots, chemical apron, respirator. Strictly do not apply near open waterways."
            environmental_restrictions:
              max_temp_c: 28.0
              max_humidity_pct: 95.0
              min_soil_moisture_pct: 20.0

      bacterial_spot:
        display_name: "Bacterial Spot"
        pathogen: "Xanthomonas perforans / euvesicatoria (Bacterium)"
        characteristic_symptoms: "Small (1-3mm) circular dark brown/black spots on foliage, greasy appearance on underside, chlorotic yellow halos, ragged leaf perforation."
        severity_tiers:
          mild:
            description: "Scattered dark speckles (<10 per leaflet)"
            recommended_treatment_id: "TRT_COPPER_BACTERICIDE"
          moderate:
            description: "Dense dark speckling, leaves yellowing, holes developing"
            recommended_treatment_id: "TRT_COPPER_BACTERICIDE"
          severe:
            description: "Extensive leaf blight, defoliation, sunburn on exposed fruit"
            recommended_treatment_id: "TRT_COPPER_BACTERICIDE"
        treatments:
          - id: "TRT_COPPER_BACTERICIDE"
            trade_name: "Fixed Copper Hydroxide + Bacillus amyloliquefaciens"
            chemical_class: "Inorganic Bactericide + Biological Shield"
            target_inventory_code: "TANK_COPPER_FUNGICIDE"
            active_concentration_gl: 2.0
            dosage_description: "2.0 g/L Copper + 2.0 mL/L Bio-culture"
            application_method: "Targeted localized canopy misting"
            pulse_duration_ms: 2500
            estimated_volume_ml: 40.0
            spray_pressure_psi: 35
            re_entry_interval_hours: 24
            pre_harvest_interval_days: 0
            safety_notes: "Avoid application during mid-day sunlight to prevent copper phytotoxicity."
            environmental_restrictions:
              max_temp_c: 32.0
              max_humidity_pct: 85.0
              min_soil_moisture_pct: 20.0

      leaf_mold:
        display_name: "Leaf Mold"
        pathogen: "Passalora fulva / Cladosporium fulvum (Fungus)"
        characteristic_symptoms: "Pale green to yellow spots on upper leaf surface, olive-green velvety mold on underside."
        severity_tiers:
          mild:
            description: "Chlorotic spots on upper side with faint velvety growth on lower side"
            recommended_treatment_id: "TRT_COPPER_HYDROXIDE"
          moderate:
            description: "Velvety olive-brown fungal growth spreading across mid-canopy"
            recommended_treatment_id: "TRT_COPPER_HYDROXIDE"
          severe:
            description: "Leaves curl, wither, and drop prematurely"
            recommended_treatment_id: "TRT_COPPER_HYDROXIDE"
        treatments:
          - id: "TRT_COPPER_HYDROXIDE"
            trade_name: "Copper Hydroxide 77% WP"
            chemical_class: "Inorganic Copper Protectant"
            target_inventory_code: "TANK_COPPER_FUNGICIDE"
            active_concentration_gl: 2.0
            dosage_description: "2.0 grams per Liter of clean water"
            application_method: "Direct spray on lower leaf surface"
            pulse_duration_ms: 2500
            estimated_volume_ml: 40.0
            spray_pressure_psi: 35
            re_entry_interval_hours: 48
            pre_harvest_interval_days: 0
            safety_notes: "Wear respirator and nitrile gloves."
            environmental_restrictions:
              max_temp_c: 32.0
              max_humidity_pct: 88.0
              min_soil_moisture_pct: 20.0

      septoria_leaf_spot:
        display_name: "Septoria Leaf Spot"
        pathogen: "Septoria lycopersici (Fungus)"
        characteristic_symptoms: "Numerous small circular lesions with gray/tan centers and dark brown margins with black pycnidia specks."
        severity_tiers:
          mild:
            description: "Scattered circular spots (<3mm) confined to oldest bottom leaves"
            recommended_treatment_id: "TRT_COPPER_HYDROXIDE"
          moderate:
            description: "Multiple coalescing lesions causing leaflet chlorosis and leaf curl"
            recommended_treatment_id: "TRT_COPPER_HYDROXIDE"
          severe:
            description: "Upward canopy defoliation exposing fruit to sunscald"
            recommended_treatment_id: "TRT_COPPER_HYDROXIDE"
        treatments:
          - id: "TRT_COPPER_HYDROXIDE"
            trade_name: "Copper Hydroxide 77% WP"
            chemical_class: "Inorganic Protectant"
            target_inventory_code: "TANK_COPPER_FUNGICIDE"
            active_concentration_gl: 2.0
            dosage_description: "2.0 g/L water"
            application_method: "Downward precision spray coating infected basal foliage"
            pulse_duration_ms: 2500
            estimated_volume_ml: 40.0
            spray_pressure_psi: 35
            re_entry_interval_hours: 48
            pre_harvest_interval_days: 0
            safety_notes: "Apply PPE. Avoid spray drift."
            environmental_restrictions:
              max_temp_c: 30.0
              max_humidity_pct: 90.0
              min_soil_moisture_pct: 20.0

      spider_mites:
        display_name: "Two-Spotted Spider Mite"
        pathogen: "Tetranychus urticae (Arachnid Pest)"
        characteristic_symptoms: "Fine yellow/white stippling on leaf surface, fine webbing on undersides, leaf bronzing."
        severity_tiers:
          mild:
            description: "Fine yellow stippling visible on upper leaf surfaces of a few leaves"
            recommended_treatment_id: "TRT_BIO_NEEM"
          moderate:
            description: "Dense speckling, fine webbing visible under leaves"
            recommended_treatment_id: "TRT_BIO_NEEM"
          severe:
            description: "Extensive webbing covering leaf clusters, bronzing, leaf desiccation"
            recommended_treatment_id: "TRT_BIO_NEEM"
        treatments:
          - id: "TRT_BIO_NEEM"
            trade_name: "Cold-Pressed Organic Bio-Neem Solution"
            chemical_class: "Bio-Miticide & Insect Growth Regulator"
            target_inventory_code: "TANK_NEEM_ORGANIC"
            active_concentration_gl: 4.0
            dosage_description: "4.0 mL per Liter of water"
            application_method: "High-pressure fine misting targeted directly under leaf canopies"
            pulse_duration_ms: 3000
            estimated_volume_ml: 50.0
            spray_pressure_psi: 30
            re_entry_interval_hours: 4
            pre_harvest_interval_days: 1
            safety_notes: "Apply during early morning or evening to protect pollinators."
            environmental_restrictions:
              max_temp_c: 30.0
              max_humidity_pct: 92.0
              min_soil_moisture_pct: 20.0

      target_spot:
        display_name: "Target Spot"
        pathogen: "Corynespora cassiicola (Fungus)"
        characteristic_symptoms: "Small brown circular lesions with light brown centers and dark margins resembling target rings."
        severity_tiers:
          mild:
            description: "Pinpoint brown specks on upper canopy foliage"
            recommended_treatment_id: "TRT_COPPER_HYDROXIDE"
          moderate:
            description: "Target lesions expanding to 5-10mm with distinct concentric zones"
            recommended_treatment_id: "TRT_COPPER_HYDROXIDE"
          severe:
            description: "Leaf drop and sunken circular lesions on mature green/red fruit"
            recommended_treatment_id: "TRT_COPPER_HYDROXIDE"
        treatments:
          - id: "TRT_COPPER_HYDROXIDE"
            trade_name: "Copper Hydroxide 77% WP"
            chemical_class: "Inorganic Protectant"
            target_inventory_code: "TANK_COPPER_FUNGICIDE"
            active_concentration_gl: 2.0
            dosage_description: "2.0 g/L water"
            application_method: "Uniform canopy spray"
            pulse_duration_ms: 2500
            estimated_volume_ml: 40.0
            spray_pressure_psi: 35
            re_entry_interval_hours: 48
            pre_harvest_interval_days: 0
            safety_notes: "Full PPE required."
            environmental_restrictions:
              max_temp_c: 32.0
              max_humidity_pct: 88.0
              min_soil_moisture_pct: 20.0

      yellow_leaf_curl_virus:
        display_name: "Tomato Yellow Leaf Curl Virus (TYLCV)"
        pathogen: "Tomato Yellow Leaf Curl Virus (Begomovirus)"
        characteristic_symptoms: "Severe upward leaf curling, cup-shaped leaflets, interveinal chlorosis, stunted bushy plant growth."
        severity_tiers:
          mild:
            description: "Subtle upward cupping of youngest apical leaves with slight pale margin"
            recommended_treatment_id: "TRT_BIO_NEEM"
          moderate:
            description: "Pronounced leaf curling, reduced leaflet size, noticeable plant stunting"
            recommended_treatment_id: "TRT_BIO_NEEM"
          severe:
            description: "Severe bushy dwarfism, complete flower abscission, zero fruit set"
            recommended_treatment_id: "TRT_BIO_NEEM"
        treatments:
          - id: "TRT_BIO_NEEM"
            trade_name: "Cold-Pressed Organic Bio-Neem Solution (Vector Suppression)"
            chemical_class: "Bio-Insecticide (Whitefly Vector Control)"
            target_inventory_code: "TANK_NEEM_ORGANIC"
            active_concentration_gl: 5.0
            dosage_description: "5.0 mL per Liter of water"
            application_method: "Foliar spray targeting whitefly nymphs on leaf undersides"
            pulse_duration_ms: 3000
            estimated_volume_ml: 48.0
            spray_pressure_psi: 30
            re_entry_interval_hours: 4
            pre_harvest_interval_days: 1
            safety_notes: "Viruses cannot be cured chemically; primary intervention is vector control."
            environmental_restrictions:
              max_temp_c: 30.0
              max_humidity_pct: 92.0
              min_soil_moisture_pct: 20.0

      mosaic_virus:
        display_name: "Tomato Mosaic Virus (ToMV)"
        pathogen: "Tomato mosaic tobamovirus"
        characteristic_symptoms: "Light and dark green mottling (mosaic pattern) on leaves, leaf distortion (shoestring or fern-like look)."
        severity_tiers:
          mild:
            description: "Faint mosaic pattern on upper leaflets with slight leaf crinkling"
            recommended_treatment_id: null
          moderate:
            description: "Obvious mottling, reduced leaf blade area"
            recommended_treatment_id: null
          severe:
            description: "Severe 'fern-leaf' distortion, systemic stunting"
            recommended_treatment_id: null
        treatments: []

      healthy:
        display_name: "Healthy Foliage"
        pathogen: "None (Optimal Agronomic Vigor)"
        characteristic_symptoms: "Vibrant green leaves, uniform turgor pressure, absence of necrotic lesions or chlorosis."
        severity_tiers:
          mild: { description: "Normal", recommended_treatment_id: null }
        treatments: []

  pepper:
    scientific_name: "Capsicum annuum"
    common_name: "Pepper (Bell)"
    diseases:
